# Render Blueprint: deploy backend on Render. Create a Blueprint from this repo.
services:
  - type: web
    name: fund-compass-api-v8-candidate
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Owner sessions/login limits are process-local; do not inherit WEB_CONCURRENCY.
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FUND_DB_BACKEND
        value: turso
      - key: FUND_DB_PERSISTENCE
        value: turso_candidate
      - key: FUND_DB_TIMEOUT_SECONDS
        value: 60
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WORKER_TOKEN
        sync: false
      - key: PRIVATE_READ_TOKEN
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
