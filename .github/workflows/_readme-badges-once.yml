name: One-time README badges

on:
  push:
    branches: [chore/readme-badges-20261031]
    paths:
      - .github/workflows/_readme-badges-once.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert standardized badges
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import os, re, subprocess
          readme = Path('README.md')
          if not readme.exists(): raise SystemExit('README.md not found')
          repo = os.environ['REPO']; branch = os.environ.get('BRANCH') or 'main'; badges = []
          tags = subprocess.run(['git','tag','--list'], text=True, capture_output=True, check=True).stdout.splitlines()
          if tags: badges.append(f'[![Version](https://img.shields.io/github/v/tag/{repo}?sort=semver&style=flat-square&label=version)](https://github.com/{repo}/tags)')
          wfdir = Path('.github/workflows')
          workflows = [p for p in wfdir.glob('*.y*ml') if p.name != '_readme-badges-once.yml'] if wfdir.exists() else []
          keywords = ('ci','test','build','deploy','release')
          workflows.sort(key=lambda p: (0 if any(k in p.name.lower() for k in keywords) else 1, p.name.lower()))
          if workflows:
              wf = workflows[0].name; wf_url = quote(wf, safe='')
              badges.append(f'[![Build](https://github.com/{repo}/actions/workflows/{wf_url}/badge.svg?branch={branch})](https://github.com/{repo}/actions/workflows/{wf_url})')
          badges.append(f'[![Last commit](https://img.shields.io/github/last-commit/{repo}?style=flat-square)](https://github.com/{repo}/commits/{branch})')
          if any(Path('.').glob('LICENSE*')): badges.append(f'[![License](https://img.shields.io/github/license/{repo}?style=flat-square)](LICENSE)')
          block = '<!-- project-badges:start -->\n' + ' '.join(badges) + '\n<!-- project-badges:end -->'
          text = readme.read_text(encoding='utf-8'); pattern = re.compile(r'<!-- project-badges:start -->.*?<!-- project-badges:end -->', re.S)
          if pattern.search(text): text = pattern.sub(block, text, count=1)
          else:
              h1 = re.search(r'(?m)^#\s+.+$', text)
              text = block + '\n\n' + text if not h1 else text[:h1.end()] + '\n\n' + block + text[h1.end():]
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Commit README and remove one-time workflow
        run: |
          rm .github/workflows/_readme-badges-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/_readme-badges-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "docs: add standardized project badges"
          git push
