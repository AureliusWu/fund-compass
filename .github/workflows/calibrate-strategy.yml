name: calibrate-strategy

on:
  schedule:
    - cron: '40 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-data-main
  queue: max

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Require backend private-read configuration
        env:
          FUND_API_BASE: ${{ secrets.FUND_API_BASE }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$FUND_API_BASE" || { echo "FUND_API_BASE is required"; exit 1; }
          test -n "$PRIVATE_READ_TOKEN" || { echo "PRIVATE_READ_TOKEN secret is required"; exit 1; }
      - name: Calibrate strategy candidate
        env:
          CALIBRATION_MIN_VALID: '12'
          CALIBRATION_MAX_FUNDS: '30'
          FUND_API_BASE: ${{ secrets.FUND_API_BASE }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python tools/calibrate_strategy.py
      - name: Upload calibration evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: strategy-calibration-${{ github.run_number }}
          path: |
            frontend/public/data/strategy-calibration.json
            backend/data/strategy-params.json
          retention-days: 90
      - name: Commit calibration evidence when changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain frontend/public/data/strategy-calibration.json backend/data/strategy-params.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend/public/data/strategy-calibration.json backend/data/strategy-params.json
            git commit -m "chore: calibrate strategy"
            base_sha=$(git rev-parse HEAD^)
            pushed=false
            for attempt in 1 2 3; do
              if ! git fetch --no-tags origin main; then
                sleep $((attempt * 2))
                continue
              fi
              remote_sha=$(git rev-parse origin/main)
              [[ "$remote_sha" == "$base_sha" ]] || {
                echo "main changed while data was generated; rerun on the new HEAD" >&2
                exit 1
              }
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done
            [[ "$pushed" == "true" ]] || { echo "Failed to push generated data" >&2; exit 1; }
            commit_sha=$(git rev-parse HEAD)
            dispatched=false
            for attempt in 1 2 3; do
              if gh workflow run ci.yml --ref main -f target_sha="$commit_sha"; then
                dispatched=true
                break
              fi
              sleep $((attempt * 2))
            done
            [[ "$dispatched" == "true" ]] || { echo "Failed to create exact-source CI run" >&2; exit 1; }
            echo "Created exact-source CI run for generated commit"
          else
            echo "No calibration changes"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
