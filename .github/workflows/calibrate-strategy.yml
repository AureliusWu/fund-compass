name: calibrate-strategy

on:
  schedule:
    - cron: '40 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-data-main
  queue: max

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Require backend private-read configuration
        env:
          FUND_API_BASE: ${{ secrets.FUND_API_BASE }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$FUND_API_BASE" || { echo "FUND_API_BASE is required"; exit 1; }
          test -n "$PRIVATE_READ_TOKEN" || { echo "PRIVATE_READ_TOKEN secret is required"; exit 1; }
      - name: Calibrate strategy candidate
        id: calibration
        env:
          CALIBRATION_MIN_VALID: '12'
          CALIBRATION_MAX_FUNDS: '30'
          CALIBRATION_OUTCOME_ATTEMPTS: '3'
          CALIBRATION_OUTCOME_TIMEOUT_SECONDS: '45'
          CALIBRATION_OUTCOME_TOTAL_BUDGET_SECONDS: '150'
          CALIBRATION_OUTCOME_BACKOFF_SECONDS: '5'
          CALIBRATION_OUTCOME_RETRY_AFTER_MAX_SECONDS: '15'
          CALIBRATION_OUTCOME_MAX_RESPONSE_BYTES: '8388608'
          FUND_API_BASE: ${{ secrets.FUND_API_BASE }}
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_READ_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python tools/calibrate_strategy.py
      - name: Enforce private calibration publication boundary
        if: always()
        env:
          CALIBRATION_STEP_OUTCOME: ${{ steps.calibration.outcome }}
        shell: bash
        run: |
          if [[ "$CALIBRATION_STEP_OUTCOME" == "success" ]]; then
            execution_status=blocked
            reason=private_sink_required
          else
            execution_status=failed
            reason=calibration_validation_failed
          fi
          {
            echo "### Strategy calibration publication"
            echo
            echo "- execution_status: $execution_status"
            echo "- artifact_status: unavailable"
            echo "- reason: $reason"
            echo "- publication: BLOCKED_PRIVATE_SINK_REQUIRED"
            echo "- private_output_published: false"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Calibration output remains unpublished until authenticated private storage is available." >&2
          exit 1
