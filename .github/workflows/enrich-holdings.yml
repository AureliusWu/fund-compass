name: enrich-holdings

# 司南基金 · AKShare 离线富集（持仓+行业）。
# 季度披露，故每周一跑一次足矣 + 可手动触发。抓公开基金种子列表，
# 输出 frontend/public/data/enrich/*.json 并提交（随 Pages 部署）。
on:
  schedule:
    - cron: '0 1 * * 1' # 每周一 UTC 01:00 ≈ CST 09:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-data-main
  queue: max

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # akshare 抓取若卡住，最多 20 分钟自动终止，不空耗
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 安装 akshare
        run: pip install -r tools/requirements-enrich.txt
      - name: 富集持仓（akshare）
        id: holdings
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1' # 日志实时输出，能看到「抓取 X …」进度
        run: python tools/enrich.py
      - name: 富集指数估值（akshare · 乐咕乐股）· V3-5
        id: valuation
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/enrich_index_valuation.py
      - name: 富集排行（东财排行，requests）
        id: screener
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/screener.py
      - name: 提交数据
        run: |
          if [[ -n "$(git status --porcelain frontend/public/data/enrich frontend/public/data/index-valuation.json frontend/public/data/screener.json frontend/public/data/screener)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend/public/data/enrich frontend/public/data/index-valuation.json frontend/public/data/screener.json frontend/public/data/screener
            git commit -m "chore: 更新可用富集数据"
            base_sha=$(git rev-parse HEAD^)
            pushed=false
            for attempt in 1 2 3; do
              if ! git fetch --no-tags origin main; then
                sleep $((attempt * 2))
                continue
              fi
              remote_sha=$(git rev-parse origin/main)
              [[ "$remote_sha" == "$base_sha" ]] || {
                echo "main changed while data was generated; rerun on the new HEAD" >&2
                exit 1
              }
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done
            [[ "$pushed" == "true" ]] || { echo "Failed to push generated data" >&2; exit 1; }
            commit_sha=$(git rev-parse HEAD)
            dispatched=false
            for attempt in 1 2 3; do
              if gh workflow run ci.yml --ref main -f target_sha="$commit_sha"; then
                dispatched=true
                break
              fi
              sleep $((attempt * 2))
            done
            [[ "$dispatched" == "true" ]] || { echo "Failed to create exact-source CI run" >&2; exit 1; }
            echo "Created exact-source CI run for generated commit"
          else
            echo "无变化"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 报告富集分支失败
        if: always()
        env:
          HOLDINGS_OUTCOME: ${{ steps.holdings.outcome }}
          VALUATION_OUTCOME: ${{ steps.valuation.outcome }}
          SCREENER_OUTCOME: ${{ steps.screener.outcome }}
        run: |
          echo "holdings=$HOLDINGS_OUTCOME valuation=$VALUATION_OUTCOME screener=$SCREENER_OUTCOME"
          failed=false
          [[ "$HOLDINGS_OUTCOME" == "success" ]] || failed=true
          [[ "$VALUATION_OUTCOME" == "success" ]] || failed=true
          [[ "$SCREENER_OUTCOME" == "success" ]] || failed=true
          [[ "$failed" == "false" ]] || {
            echo "One or more enrichment branches failed; successful artifacts were preserved and committed independently." >&2
            exit 1
          }
