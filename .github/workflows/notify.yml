name: manual-signal-notify

# 司南基金 · 信号通知人工应急入口。
# 盘中实时决策由页面直连后端 API 完成，不再使用 GitHub Actions 定时轮询或保活。
on:
  workflow_dispatch:
    inputs:
      force:
        description: 忽略交易时段强制运行（并发一条推送测试）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: manual-signal-notify
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 人工信号检查与推送
        env:
          API_BASE: ${{ vars.VITE_API_BASE }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SC_SENDKEY: ${{ secrets.SC_SENDKEY }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          test -n "$API_BASE" || { echo "VITE_API_BASE variable is required" >&2; exit 1; }
          python tools/notify.py
