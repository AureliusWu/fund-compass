name: post-deploy-smoke

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact validated and deployed main commit to verify
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FUND_API_BASE: ${{ secrets.FUND_API_BASE }}
      WORKER_BASE: https://sinan-estimate-push.ligugu69.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - name: 校验精确源码
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - name: 读取并校验目标版本
        id: release
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",*$/\1/p' frontend/package.json | head -1)
          test -n "$version"
          test "$(jq -r .version worker/package.json)" = "$version"
          grep -Fq "APP_VERSION = '$version'" frontend/src/version.ts
          grep -Fq "司南基金 v$version ·" frontend/vite.config.ts
          grep -Fq "version=\"$version\"" backend/main.py
          grep -Fq "version: '$version'" worker/src/index.ts
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 检查 GitHub Pages 版本
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          page=https://aureliuswu.github.io/fund-compass
          curl --fail --show-error --retry 4 --retry-delay 10 "$page/"
          for attempt in {1..24}; do
            manifest=$(curl --fail --silent --show-error "$page/manifest.webmanifest?release=${EXPECTED_SHA}" || true)
            deployed_commit=$(curl --fail --silent --show-error "$page/release.json?release=${EXPECTED_SHA}" | jq -r .commit 2>/dev/null || true)
            if jq -e --arg description "司南基金 v$EXPECTED_VERSION · 个人基金选基与择时辅助工具" '
              .name == "司南基金"
              and .lang == "zh-CN"
              and .description == $description
            ' <<<"$manifest" >/dev/null 2>&1 && [[ "$deployed_commit" == "${{ inputs.target_sha }}" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages 未在时限内呈现 v$EXPECTED_VERSION" >&2
          exit 1
      - name: 检查选基与富集静态数据契约
        env:
          PAGE_DATA_BASE: https://aureliuswu.github.io/fund-compass/data
          RELEASE_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          base = os.environ["PAGE_DATA_BASE"].rstrip("/")
          release = os.environ["RELEASE_SHA"]
          date_pattern = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          digest_pattern = re.compile(r"^[0-9a-f]{64}$")

          def download(path: str) -> bytes:
              quoted = "/".join(urllib.parse.quote(part) for part in path.split("/"))
              url = f"{base}/{quoted}?release={urllib.parse.quote(release)}"
              last_error = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          return response.read()
                  except Exception as error:
                      last_error = error
                      if attempt < 3:
                          time.sleep((attempt + 1) * 2)
              raise RuntimeError(f"static asset download failed: {path}") from last_error

          def load_json(path: str):
              return json.loads(download(path).decode("utf-8"))

          def verify_chunks(directory: str, collection: str, identity: str, minimum: int) -> None:
              manifest = load_json(f"{directory}/manifest.json")
              assert manifest.get("schema_version") == 2
              assert manifest.get("collection") == collection
              assert isinstance(manifest.get("total"), int) and manifest["total"] >= minimum
              assert digest_pattern.fullmatch(str(manifest.get("sha256", "")))
              chunks = manifest.get("chunks")
              hashes = manifest.get("chunk_sha256")
              assert isinstance(chunks, list) and chunks and len(chunks) == len(set(chunks))
              assert isinstance(hashes, dict) and set(hashes) == set(chunks)

              rows = []
              for name in chunks:
                  assert isinstance(name, str)
                  assert re.fullmatch(r"part-\d{3}-[0-9a-f]{12}\.json", name)
                  raw = download(f"{directory}/{name}")
                  expected = hashes[name]
                  assert digest_pattern.fullmatch(str(expected))
                  assert hashlib.sha256(raw).hexdigest() == expected
                  payload = json.loads(raw.decode("utf-8"))
                  assert set(payload) == {collection}
                  chunk_rows = payload[collection]
                  assert isinstance(chunk_rows, list) and chunk_rows
                  rows.extend(chunk_rows)

              assert len(rows) == manifest["total"]
              canonical = json.dumps(rows, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              assert hashlib.sha256(canonical).hexdigest() == manifest["sha256"]
              identities = [row.get(identity) for row in rows if isinstance(row, dict)]
              assert len(identities) == len(rows)
              assert all(isinstance(value, str) and value for value in identities)
              assert len(identities) == len(set(identities))
              if identity == "c":
                  assert all(re.fullmatch(r"\d{6}", value) for value in identities)
              elif identity == "id":
                  assert all(re.fullmatch(r"\d+", value) for value in identities)
              print(f"{directory}: chunks={len(chunks)} rows={len(rows)} sha256=ok unique=ok")

          verify_chunks("screener", "funds", "c", 1000)
          verify_chunks("managers", "managers", "id", 1000)

          enrich = load_json("enrich/index.json")
          assert enrich.get("schema_version") == 2
          assert enrich.get("source") == "akshare_eastmoney"
          datetime.datetime.fromisoformat(enrich["fetched_at"])
          funds = enrich.get("funds")
          assert isinstance(funds, list) and funds
          codes = [row.get("code") for row in funds if isinstance(row, dict)]
          assert len(codes) == len(funds) == len(set(codes))
          assert all(isinstance(code, str) and re.fullmatch(r"\d{6}", code) for code in codes)

          for summary in funds:
              code = summary["code"]
              detail = load_json(f"enrich/{code}.json")
              assert detail.get("schema_version") == 2
              assert detail.get("code") == code
              assert detail.get("source") == "akshare_eastmoney"
              datetime.datetime.fromisoformat(detail["fetched_at"])
              for field in ("holdings_as_of", "industries_as_of"):
                  value = detail.get(field)
                  assert value is None or date_pattern.fullmatch(value)
                  assert value == summary.get(field)
              holdings = detail.get("holdings")
              industries = detail.get("industries")
              assert isinstance(holdings, list) and holdings
              assert isinstance(industries, list) and industries
              assert len(holdings) == summary.get("n_holdings")
              assert len(industries) == summary.get("n_industries")
              holding_codes = [row.get("code") for row in holdings if isinstance(row, dict)]
              assert len(holding_codes) == len(holdings) == len(set(holding_codes))
              assert all(re.fullmatch(r"\d{5,6}", value or "") for value in holding_codes)
              assert all(isinstance(row.get("name"), str) and row["name"] for row in holdings)
              assert all(isinstance(row.get("ratio"), (int, float)) and 0 < row["ratio"] <= 100 for row in holdings)
              industry_names = [row.get("name") for row in industries if isinstance(row, dict)]
              assert len(industry_names) == len(industries) == len(set(industry_names))
              assert all(isinstance(row.get("ratio"), (int, float)) and 0 < row["ratio"] <= 100 for row in industries)
          print(f"enrich: funds={len(funds)} details=all schema-v2")

          valuation = load_json("index-valuation.json")
          assert valuation.get("schema_version") == 2
          assert valuation.get("source") == "legulegu"
          assert date_pattern.fullmatch(str(valuation.get("updated", "")))
          datetime.datetime.fromisoformat(valuation["fetched_at"])
          indices = valuation.get("indices")
          coverage = valuation.get("coverage")
          assert isinstance(indices, list) and indices
          assert isinstance(coverage, dict)
          names = [row.get("name") for row in indices if isinstance(row, dict)]
          assert len(names) == len(indices) == len(set(names))
          core = {"沪深300", "上证50", "上证180", "中证100", "中证500", "中证1000"}
          assert core.issubset(names)
          assert coverage.get("core_requested") == len(core)
          assert coverage.get("core_returned") == len(core)
          assert coverage.get("returned") == len(indices)
          assert isinstance(coverage.get("requested"), int) and coverage["requested"] >= len(indices)
          assert isinstance(coverage.get("missing"), list)
          assert len(coverage["missing"]) == len(set(coverage["missing"]))
          assert not set(coverage["missing"]) & set(names)
          assert len(indices) + len(coverage["missing"]) == coverage["requested"]
          for row in indices:
              assert date_pattern.fullmatch(str(row.get("date", "")))
              values = (row.get("pe"), row.get("pb"))
              assert any(isinstance(value, (int, float)) for value in values)
              for field in ("pe_pct", "pb_pct"):
                  value = row.get(field)
                  assert value is None or isinstance(value, (int, float)) and 0 <= value <= 100
              if row.get("name") in core:
                  assert all(isinstance(row.get(field), (int, float)) for field in ("pe", "pb", "pe_pct", "pb_pct"))
          assert valuation["updated"] == min(row["date"] for row in indices)
          print(f"index-valuation: indices={len(indices)} core={len(core)} schema-v2")
          PY
      - name: 检查后端基金全集真实产物契约
        env:
          UNIVERSE_BASE: https://raw.githubusercontent.com/AureliusWu/fund-compass/${{ inputs.target_sha }}/backend/data
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request

          base = os.environ["UNIVERSE_BASE"].rstrip("/")

          def download(name: str) -> bytes:
              last_error = None
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(f"{base}/{name}", timeout=30) as response:
                          return response.read()
                  except Exception as error:
                      last_error = error
                      if attempt < 3:
                          time.sleep((attempt + 1) * 2)
              raise RuntimeError(f"universe asset download failed: {name}") from last_error

          meta = json.loads(download("fund-universe.meta.json").decode("utf-8"))
          compressed = download("fund-universe.json.gz")
          assert compressed.startswith(b"\x1f\x8b")
          payload = gzip.decompress(compressed)
          digest = hashlib.sha256(payload).hexdigest()

          assert isinstance(meta, dict)
          assert meta.get("schema_version") == 1
          assert isinstance(meta.get("fund_count"), int) and not isinstance(meta["fund_count"], bool)
          assert meta["fund_count"] >= 1000
          assert re.fullmatch(r"[0-9a-f]{64}", str(meta.get("sha256", "")))
          assert digest == meta["sha256"]

          funds = json.loads(payload)
          assert isinstance(funds, list) and len(funds) == meta["fund_count"]
          codes = []
          for row in funds:
              assert isinstance(row, dict) and set(row) == {"code", "name", "type", "pinyin"}
              code = row["code"]
              name = row["name"]
              assert isinstance(code, str) and re.fullmatch(r"\d{6}", code)
              assert isinstance(name, str) and name == name.strip() and 0 < len(name) <= 200
              for field in ("type", "pinyin"):
                  value = row[field]
                  assert value is None or isinstance(value, str) and len(value) <= 200
              codes.append(code)

          assert codes == sorted(codes)
          assert len(codes) == len(set(codes))
          print(f"fund-universe: rows={len(funds)} gzip=ok sha256=ok unique=ok sorted=ok")
          PY
      - name: 检查后端版本、基金与策略注册表
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          api=${FUND_API_BASE:-https://fund-compass-api.onrender.com}
          for attempt in {1..40}; do
            health=$(curl --fail --silent --show-error "$api/api/health" || true)
            if jq -e --arg version "$EXPECTED_VERSION" --arg commit "$EXPECTED_SHA" '
              .status == "ok"
              and .version == $version
              and .deployment.platform == "render"
              and .deployment.commit == $commit
            ' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "API 未在时限内呈现 v$EXPECTED_VERSION" >&2
              exit 1
            fi
            sleep 15
          done
          jq -e '
            .database.engine == "sqlite"
            and .database.persistence == "ephemeral"
            and .database.durable == false
            and .universe_ready == true
            and (.universe | type) == "number"
            and .universe >= 1000
          ' <<<"$health" >/dev/null
          fund=$(curl --fail --silent --show-error "$api/api/fund/005844")
          jq -e '
            .code == "005844"
            and (.latest_nav | type) == "number"
            and (.latest_nav_date | type) == "string"
            and (.latest_nav_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
            and (.stale | type) == "boolean"
          ' <<<"$fund" >/dev/null
          curl --fail --silent --show-error "$api/api/strategy/registry" | jq -e 'type == "object"' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$api/api/fund/not-a-code")" = "404"
      - name: 检查 Worker 版本与估值契约
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          for attempt in {1..40}; do
            health=$(curl --fail --silent --show-error "$WORKER_BASE/health" || true)
            if jq -e --arg version "$EXPECTED_VERSION" '.status == "ok" and .version == $version' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Worker 未在时限内呈现 v$EXPECTED_VERSION" >&2
              exit 1
            fi
            sleep 15
          done
          jq -e '
            .runtime
            | has("last_cron_at")
              and has("last_cron_result")
              and has("last_cron_reason")
              and has("last_attempt_at")
              and has("last_success_at")
          ' <<<"$health" >/dev/null
          jq -e '
            .configured.gist_id == true
            and .configured.gist_token == true
            and .configured.serverchan == true
            and .configured.worker == true
            and .configured.fund_api == true
          ' <<<"$health" >/dev/null
          estimates=$(curl --fail --silent --show-error "$WORKER_BASE/estimates?codes=005844,018147")
          jq -e '
            .requested == 2
            and (.returned + .unavailable == .requested)
            and (.status == "ok" or .status == "degraded" or .status == "unavailable")
            and (.source | type) == "string"
            and (.fetched_at | type) == "string"
            and (.accounting | type) == "object"
            and (.accounting.primary | type) == "number"
            and (.accounting.model | type) == "number"
            and (.accounting.official | type) == "number"
            and (.accounting.unavailable | type) == "number"
            and (.accounting.primary + .accounting.model + .accounting.official + .accounting.unavailable == .requested)
            and all(.items[];
              (.code | test("^[0-9]{6}$"))
              and (.last_nav | type) == "number"
              and (.est_nav | type) == "number"
              and (.est_change | type) == "number"
              and (.est_realtime | type) == "boolean"
              and (.est_kind == "estimate" or .est_kind == "holdings_model" or .est_kind == "official_nav")
              and (if .est_kind == "estimate" then
                ((.source_time_precision == "datetime" and .status == "fresh" and .est_realtime == true)
                  or ((.source_time_precision == "date" or .source_time_precision == "datetime")
                    and .status == "delayed" and .est_realtime == false))
              elif .est_kind == "holdings_model" then
                .status == "modeled"
                and .source == "eastmoney_holdings_model"
                and .est_realtime == false
                and .source_time_precision == "datetime"
                and (.base_nav | type) == "number"
                and (.base_nav_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and (.value_nav | type) == "number"
                and (.value_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and (.est_time | type) == "string"
                and (.model_coverage | type) == "number"
                and .model_coverage >= 0 and .model_coverage <= 100
                and (.model_quote_count | type) == "number"
                and .model_quote_count > 0
                and (.model_report_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and (.model_oldest_quote_time | type) == "string"
                and (.model_newest_quote_time | type) == "string"
                and (.model_rejected_count | type) == "number"
                and (.est_note | type) == "string"
                and ((.est_note | contains("非官方")) or (.est_note | contains("不是基金公司官方")))
              elif .est_kind == "official_nav" then
                .est_realtime == false
                and .status == "latest_official"
                and .source == "eastmoney_official_nav"
                and (.fallback_reason | type) == "string"
              else true end)
            )
            and all(.unavailable_items[];
              .status == "unavailable"
              and .last_nav == null
              and .est_nav == null
              and .est_change == null
              and (.fallback_reason | type) == "string"
            )
          ' <<<"$estimates" >/dev/null
