name: Deploy frontend to GitHub Pages

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact validated main commit to deploy
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha }}
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - name: Verify production API endpoint
        shell: bash
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          test -n "${VITE_API_BASE:-}"
          case "$VITE_API_BASE" in
            /api|./api|../api|http://*|https://localhost*|https://127.0.0.1*|https://0.0.0.0*)
              echo "VITE_API_BASE must be an absolute public HTTPS endpoint ending in /api" >&2
              exit 1
              ;;
          esac
          [[ "$VITE_API_BASE" =~ ^https://[^/?#[:space:]]+/api$ ]] || {
            echo "VITE_API_BASE must be an absolute public HTTPS endpoint ending in /api" >&2
            exit 1
          }
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Stamp exact deployed commit
        shell: bash
        run: printf '{"commit":"%s"}\n' '${{ inputs.target_sha }}' > dist/release.json
      - name: Verify production artifact
        run: test -f dist/index.html && test -f dist/manifest.webmanifest && test "$(jq -r .commit dist/release.json)" = "${{ inputs.target_sha }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
