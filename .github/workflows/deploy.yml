name: Deploy frontend to GitHub Pages

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact validated main commit to deploy
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
        env:
          # 在仓库 Settings → Actions → Variables 里设 VITE_API_BASE 为后端公网地址；
          # 未设时为空，前端回退 /api（GitHub Pages 上无后端会显示未连接，属正常）。
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Stamp exact deployed commit
        shell: bash
        run: printf '{"commit":"%s"}\n' '${{ inputs.target_sha }}' > dist/release.json
      - name: Verify production artifact
        run: test -f dist/index.html && test -f dist/manifest.webmanifest && test "$(jq -r .commit dist/release.json)" = "${{ inputs.target_sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
