name: overseas-accuracy

on:
  schedule:
    - cron: '35 6 * * 1-5'
  workflow_dispatch:
    inputs:
      journal_check_only:
        description: Restore and republish the unchanged public journal only (no producer/financial event)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-data-main
  queue: max

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FUND_API_BASE: ${{ secrets.FUND_API_BASE }}
      GH_TOKEN: ${{ github.token }}
      OVERSEAS_JOURNAL_CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.journal_check_only && 'true' || 'false' }}
      OVERSEAS_RUN_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      OVERSEAS_SCHEDULE_TIME: '14:35'
      OVERSEAS_PREDICTION_EARLY_MINUTES: '5'
      OVERSEAS_PREDICTION_LATE_MINUTES: '45'
      OVERSEAS_ZERO_PREDICTION_LIMIT: '2'
      OVERSEAS_EFFECTIVE_MAX_AGE_HOURS: '96'
      OVERSEAS_MAX_BASE_AGE_DAYS: '7'
      OVERSEAS_MIN_SAMPLES: '20'
      OVERSEAS_NON_TRADING_DATES: ${{ vars.OVERSEAS_NON_TRADING_DATES }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run native pipeline and record public occurrence
        id: overseas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/record_overseas_ops.py
      - name: Preserve cumulative public journal checkpoint
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: overseas-public-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overseas-ops/overseas-run-journal.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.journal_check_only) }}
        with:
          name: overseas-accuracy-${{ github.run_number }}
          path: |
            frontend/public/data/overseas-accuracy.json
            frontend/public/data/overseas-audit.json
            frontend/src/data/overseas-models.json
            backend/data/overseas-evidence.json
          retention-days: 90
