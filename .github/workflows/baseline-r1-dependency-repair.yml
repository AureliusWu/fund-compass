name: Baseline R1 dependency repair

on:
  push:
    branches:
      - chore/repository-baseline-r1-20261031
    paths:
      - .github/workflows/baseline-r1-dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/repository-baseline-r1-20261031
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Repair audited development dependencies
        working-directory: frontend
        run: |
          npm install --save-dev --save-exact vue-tsc@3.3.14 --package-lock-only
          npm audit fix --package-lock-only
          npm ci --include=dev
          npm run type-check
          npm run test
          npm run build
          npm audit --include=dev --audit-level=moderate
      - name: Commit repaired lock and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/baseline-r1-dependency-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .github/workflows/baseline-r1-dependency-repair.yml
          git diff --cached --quiet && exit 1
          git commit -m "chore: repair audited frontend dependencies"
          git push origin HEAD:chore/repository-baseline-r1-20261031
