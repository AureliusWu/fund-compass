name = "sinan-estimate-push"
main = "src/index.ts"
compatibility_date = "2026-07-11"
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true

[triggers]
# Use names to avoid Cloudflare's nonstandard 1=Sunday weekday numbering.
crons = ["30 6 * * MON-FRI", "40 6 * * MON-FRI"]

[vars]
FUND_API_BASE = "https://fund-compass-api.onrender.com"
